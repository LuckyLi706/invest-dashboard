<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股攻防板块趋势</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1220; --card: #151c30; --card2: #1a2340;
    --text: #e8ecf5; --muted: #8b94ad; --line: #232c48;
    --up: #f23645; --down: #25b877; --accent: #4d7cff;
  }
  body { background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(13,18,32,.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  .head-in { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0; flex-wrap: wrap; gap: 10px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  h1 small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 4px; }
  .tabs { display: flex; gap: 8px; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--muted);
    padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: .2s; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .ranges { display: flex; gap: 6px; align-items: center; }
  .range { border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .range.active { background: var(--card2); color: var(--text); border-color: var(--accent); }
  main { padding: 20px 0 40px; }
  .updated { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .panel-title { font-size: 16px; font-weight: 600; margin: 6px 0 12px;
    display: flex; align-items: center; gap: 8px; }
  .panel-title .dot { width: 8px; height: 8px; border-radius: 50%; }
  .compare-box, .card { background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .compare-box .chart { height: 320px; }
  .grid { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 10px;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .grid::-webkit-scrollbar { height: 8px; }
  .grid::-webkit-scrollbar-track { background: var(--card); border-radius: 4px; }
  .grid::-webkit-scrollbar-thumb { background: #2c3a5e; border-radius: 4px; }
  .grid .card { flex: 0 0 370px; max-width: 86vw; scroll-snap-align: start; margin-bottom: 0; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .card-name { font-size: 17px; font-weight: 700; }
  .card-name .code { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
  .card-type { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .last-val { text-align: right; }
  .last-val .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .last-val .d { font-size: 11px; color: var(--muted); }
  .stats { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .stat { background: var(--card2); border-radius: 8px; padding: 6px 12px; font-size: 12px; }
  .stat .k { color: var(--muted); margin-right: 6px; }
  .stat .n { font-weight: 700; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }
  .card .chart { height: 240px; }
  footer { color: var(--muted); font-size: 12px; line-height: 1.8; padding: 20px 0 40px;
    border-top: 1px solid var(--line); }
  .err { background: #3a1d22; border: 1px solid var(--up); color: #ffb3ba;
    padding: 16px; border-radius: 8px; margin: 20px 0; }
  @media (max-width: 640px) { .compare-box .chart { height: 260px; } h1 { font-size: 17px; } }
</style>
</head>
<body>
<header>
  <div class="wrap head-in">
    <h1>A股攻防板块趋势<small>防御 × 进攻 · 日线走势</small></h1>
    <div class="tabs">
      <button class="tab active" data-tab="def">🛡 防御板块</button>
      <button class="tab" data-tab="atk">⚔ 进攻板块</button>
    </div>
    <div class="ranges" id="ranges">
      <button class="range" data-r="22">近1月</button>
      <button class="range" data-r="66">近3月</button>
      <button class="range active" data-r="132">近6月</button>
      <button class="range" data-r="252">近1年</button>
      <button class="range" data-r="0">全部</button>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="updated" id="updated">数据加载中…</div>
  <div id="err"></div>

  <section id="sec-def">
    <div class="panel-title"><span class="dot" style="background:#4d7cff"></span>防御板块 · 归一化对比（区间起点=100）</div>
    <div class="compare-box"><div class="chart" id="cmp-def"></div></div>
    <div class="grid" id="grid-def"></div>
  </section>

  <section id="sec-atk" style="display:none">
    <div class="panel-title"><span class="dot" style="background:#f23645"></span>进攻板块 · 归一化对比（区间起点=100）</div>
    <div class="compare-box"><div class="chart" id="cmp-atk"></div></div>
    <div class="grid" id="grid-atk"></div>
  </section>
</main>
<footer class="wrap">
  数据来源：新浪财经 / 腾讯证券公开行情接口，盘后快照（ETF 为前复权口径仅作趋势参考）。<br>
  本站仅做板块趋势可视化展示，不构成任何投资建议。市场有风险，投资需谨慎。
</footer>

<script>
const COLORS = { bank:'#4d7cff', div:'#ff9f43', consume:'#25b877',
                 telecom:'#b06cff', semi:'#f23645', chip:'#ffce54' };
const GROUPS = {
  def: ['bank','div','consume'],
  atk: ['telecom','semi','chip']
};
let DATA = null, rangeDays = 132, charts = {};

function fmtPct(v){ if(v==null) return '--';
  const c = v>0?'up':(v<0?'down':'');
  return `<span class="${c}">${v>0?'+':''}${v}%</span>`; }

function sliceRange(s){
  if(!rangeDays) return {d:s.dates, c:s.closes};
  const n = Math.min(rangeDays, s.dates.length);
  return { d: s.dates.slice(-n), c: s.closes.slice(-n) };
}

function lineOption(series, title){
  return {
    backgroundColor:'transparent',
    tooltip:{ trigger:'axis',
      backgroundColor:'#1a2340', borderColor:'#2c3a5e', textStyle:{color:'#e8ecf5',fontSize:12},
      valueFormatter: v => typeof v==='number'? v.toLocaleString('zh-CN',{maximumFractionDigits:2}) : v },
    grid:{ left:8, right:14, top:30, bottom:8, containLabel:true },
    xAxis:{ type:'category', data:series[0].d,
      axisLine:{lineStyle:{color:'#232c48'}}, axisTick:{show:false},
      axisLabel:{color:'#8b94ad',fontSize:11,
        formatter:(v,i)=> i%Math.ceil(series[0].d.length/6)===0 ? v.slice(5) : ''} },
    yAxis:{ type:'value', scale:true,
      splitLine:{lineStyle:{color:'#1b2340'}}, axisLabel:{color:'#8b94ad',fontSize:11} },
    legend:{ textStyle:{color:'#8b94ad',fontSize:12}, top:0 },
    series: series.map(s=>({
      name:s.name, type:'line', data:s.c, showSymbol:false, smooth:true,
      symbol:'circle', symbolSize:6,
      lineStyle:{ width:2, color:s.color },
      itemStyle:{ color:s.color },
      areaStyle:{ color:s.color, opacity:0.08 },
      emphasis:{ focus:'series' }
    }))
  };
}

function renderCompare(key){
  const el = document.getElementById('cmp-'+key);
  const chart = charts['cmp-'+key] || echarts.init(el);
  charts['cmp-'+key] = chart;
  const list = GROUPS[key].map(k=>{
    const s = DATA.series.find(x=>x.key===k);
    const r = sliceRange(s);
    const base = r.c[0];
    return { name:`${s.short} ${s.name}`, color:COLORS[k],
             d:r.d, c:r.c.map(v=>+(v/base*100).toFixed(2)) };
  });
  chart.setOption(lineOption(list), true);
  chart.resize();
}

function renderCards(key){
  const grid = document.getElementById('grid-'+key);
  grid.innerHTML = '';
  GROUPS[key].forEach(k=>{
    const s = DATA.series.find(x=>x.key===k);
    const r = sliceRange(s);
    const card = document.createElement('div');
    card.className = 'card';
    const upCls = s.chg_1y!=null && s.chg_1y>=0 ? 'up' : 'down';
    card.innerHTML = `
      <div class="card-head">
        <div><div class="card-name">${s.short}<span class="code">${s.code}</span></div>
        <div class="card-type">${s.name} · ${s.type}</div></div>
        <div class="last-val"><div class="v ${upCls}">${s.last.toLocaleString('zh-CN')}</div>
        <div class="d">${s.last_date} 收盘</div></div>
      </div>
      <div class="stats">
        <div class="stat"><span class="k">近1月</span><span class="n">${fmtPct(s.chg_1m)}</span></div>
        <div class="stat"><span class="k">近3月</span><span class="n">${fmtPct(s.chg_3m)}</span></div>
        <div class="stat"><span class="k">近1年</span><span class="n">${fmtPct(s.chg_1y)}</span></div>
      </div>
      <div class="chart" id="ch-${k}"></div>`;
    grid.appendChild(card);
    const chart = echarts.init(card.querySelector('#ch-'+k));
    charts['ch-'+k] = chart;
    chart.setOption(lineOption([{name:s.name, color:COLORS[k], d:r.d, c:r.c}]), true);
  });
}

function renderAll(){
  renderCompare('def'); renderCompare('atk');
  renderCards('def'); renderCards('atk');
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const k = t.dataset.tab;
  document.getElementById('sec-def').style.display = k==='def'?'':'none';
  document.getElementById('sec-atk').style.display = k==='atk'?'':'none';
  setTimeout(()=>{ Object.values(charts).forEach(c=>c.resize()); }, 50);
}));
document.querySelectorAll('.range').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.range').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  rangeDays = parseInt(b.dataset.r,10);
  renderAll();
}));
window.addEventListener('resize', ()=>Object.values(charts).forEach(c=>c.resize()));

fetch('./data/data.json')
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(j=>{
    DATA = j;
    document.getElementById('updated').textContent =
      `数据更新于 ${j.updated}（交易日日线收盘快照）· 共 ${j.series.length} 个标的`;
    renderAll();
  })
  .catch(e=>{
    document.getElementById('err').innerHTML =
      `<div class="err">数据加载失败：${e.message}，请检查 data/data.json 是否存在。</div>`;
    document.getElementById('updated').textContent = '数据加载失败';
  });
</script>
</body>
</html>
